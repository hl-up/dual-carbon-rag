name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and test tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install "pytest>=8,<10" "httpx>=0.27,<1" "reportlab>=4,<5" "ruff>=0.12,<1"
      - name: Lint and format
        run: |
          ruff check app.py carbon_rag scripts tests
          ruff format --check app.py carbon_rag scripts tests
      - name: Validate public evaluation example
        run: python scripts/evaluate.py evaluation/cases.example.jsonl --check
      - name: Test
        run: python -m pytest -q
