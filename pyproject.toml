[project]
name = "dual-carbon-rag"
version = "0.1.0"
description = "本地双碳政策检索与引用核查"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.40,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-chroma>=1,<2",
  "langchain-text-splitters>=1,<2",
  "pdfplumber>=0.11,<0.12",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langsmith>=0.4,<1",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3,<6",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "reportlab>=4,<5",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
